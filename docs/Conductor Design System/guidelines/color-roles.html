<!-- @dsCard group="Colors" viewport="700x200" name="Role split" subtitle="Cyan acts. Blue speaks for the AI. Mint is paint. The gradient is identity, never a second accent." -->
<!DOCTYPE html><html data-theme="aurora-dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 18px;min-height:100vh;display:flex;align-items:center}.w{width:100%}.n{font:var(--type-mono-label);color:var(--text-tertiary);letter-spacing:0}.cap{font:var(--type-label);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-disabled)}</style></head><body class="cd-wash"><div class="w"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="cd-glass-1" style="border-radius:var(--radius-lg);padding:14px;display:grid;gap:10px">
<span class="cap">Violet · --accent</span>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<span style="display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-on);font:var(--type-caption)">Run Test</span>
<span style="display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:var(--radius-sm);background:var(--accent-quiet);border:1px solid var(--accent-edge);color:var(--text-accent);font:var(--type-caption)">Selected row</span>
<span style="display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--radius-xs);border:1px solid var(--accent-ring);box-shadow:var(--glow-accent);font:var(--type-mono-label);color:var(--text-accent)">focus</span>
</div>
<span class="n" style="color:var(--text-disabled)">primary action · focus · selection · links · mirror highlight</span></div>
<div class="cd-glass-1" style="border-radius:var(--radius-lg);padding:14px;display:grid;gap:10px">
<span class="cap">Blue · --ai</span>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<span style="display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:var(--radius-sm);background:var(--ai-quiet);border:1px solid var(--ai-edge);color:var(--text-ai);font:var(--type-caption)">Generate</span>
<span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--ai-quiet);color:var(--text-ai);font:var(--type-mono-label)">generated</span>
<span style="display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--radius-xs);border:1px solid var(--ai-edge);box-shadow:var(--glow-ai);font:var(--type-mono-label);color:var(--text-ai)">focus</span>
</div>
<span class="n" style="color:var(--text-disabled)">assistant byline · AI-authored YAML lines · composer focus · never a working button</span></div></div></div></body></html>
