<!DOCTYPE html><html data-theme="aurora-dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 18px;min-height:100vh;display:flex;align-items:center}.w{width:100%}.n{font:var(--type-mono-label);color:var(--text-tertiary);letter-spacing:0}.cap{font:var(--type-label);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-disabled)}@keyframes cd-slide{to{left:calc(100% - 22px)}}</style></head><body class="cd-wash"><div class="w"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div style="display:grid;gap:6px"><div style="height:44px;border-radius:var(--radius-md);background:var(--glass-1);border:1px solid var(--edge-1);position:relative;overflow:hidden"><span style="position:absolute;top:50%;left:8px;width:14px;height:14px;margin-top:-7px;border-radius:999px;background:var(--accent);animation:cd-slide 2.4s var(--ease-glass) infinite alternate"></span></div><div class="n">--ease-glass</div><div class="n" style="color:var(--text-disabled)">panels, knobs</div></div><div style="display:grid;gap:6px"><div style="height:44px;border-radius:var(--radius-md);background:var(--glass-1);border:1px solid var(--edge-1);position:relative;overflow:hidden"><span style="position:absolute;top:50%;left:8px;width:14px;height:14px;margin-top:-7px;border-radius:999px;background:var(--accent);animation:cd-slide 2.4s var(--ease-out) infinite alternate"></span></div><div class="n">--ease-out</div><div class="n" style="color:var(--text-disabled)">hover, fades</div></div><div style="display:grid;gap:6px"><div style="height:44px;border-radius:var(--radius-md);background:var(--glass-1);border:1px solid var(--edge-1);position:relative;overflow:hidden"><span style="position:absolute;top:50%;left:8px;width:14px;height:14px;margin-top:-7px;border-radius:999px;background:var(--accent);animation:cd-slide 2.4s var(--ease-in-out) infinite alternate"></span></div><div class="n">--ease-in-out</div><div class="n" style="color:var(--text-disabled)">pulses</div></div><div style="display:grid;gap:6px"><div style="height:44px;border-radius:var(--radius-md);background:var(--glass-1);border:1px solid var(--edge-1);position:relative;overflow:hidden"><span style="position:absolute;top:50%;left:8px;width:14px;height:14px;margin-top:-7px;border-radius:999px;background:var(--accent);animation:cd-slide 2.4s var(--ease-spring) infinite alternate"></span></div><div class="n">--ease-spring</div><div class="n" style="color:var(--text-disabled)">menus only</div></div></div>
<div class="n" style="margin-top:12px">instant 80 · fast 140 · base 220 · slow 340 · lazy 600 — press scales to 0.975, never translates</div></div></body></html>
