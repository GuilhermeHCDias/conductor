<!-- @dsCard group="Colors" viewport="700x160" name="Run states" subtitle="Pass, fail, running — at least 30° apart in hue, so a 7px dot is still readable." -->
<!DOCTYPE html><html data-theme="aurora"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 18px;min-height:100vh;display:flex;align-items:center;background:var(--bg-wash),var(--bg-window)}.w{width:100%;display:grid;gap:10px}.n{font:var(--type-mono-label);color:var(--text-tertiary)}.cap{font:var(--type-label);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="w"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><div style="display:grid;gap:6px"><div style="display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:var(--radius-md);background:var(--state-pass-quiet);border:1px solid var(--state-pass-edge)"><span style="width:7px;height:7px;border-radius:999px;background:var(--state-pass)"></span><span style="font:var(--type-caption);color:var(--text-secondary)">Passed · 0:38</span></div><div class="n">--state-pass</div></div><div style="display:grid;gap:6px"><div style="display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:var(--radius-md);background:var(--state-fail-quiet);border:1px solid var(--state-fail-edge)"><span style="width:7px;height:7px;border-radius:999px;background:var(--state-fail)"></span><span style="font:var(--type-caption);color:var(--text-secondary)">Failed · step 7</span></div><div class="n">--state-fail</div></div><div style="display:grid;gap:6px"><div style="display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:var(--radius-md);background:var(--state-running-quiet);border:1px solid var(--state-running-edge)"><span style="width:7px;height:7px;border-radius:999px;background:var(--state-running)"></span><span style="font:var(--type-caption);color:var(--text-secondary)">Running · step 3</span></div><div class="n">--state-running</div></div></div><div class="n">Idle is --state-idle, a neutral: a flow that never ran has no colour opinion.</div></div></body></html>
