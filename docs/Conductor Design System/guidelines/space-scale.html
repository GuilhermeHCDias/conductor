<!DOCTYPE html><html data-theme="aurora-dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 18px;min-height:100vh;display:flex;align-items:center}.w{width:100%}.n{font:var(--type-mono-label);color:var(--text-tertiary);letter-spacing:0}.cap{font:var(--type-label);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-disabled)}</style></head><body class="cd-wash"><div class="w"><div style="display:flex;align-items:flex-end;gap:10px"><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-1);height:44px;border-radius:2px;background:var(--accent-quiet);border:1px solid var(--accent-ring)"></div><span class="n">2</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-2);height:44px;border-radius:2px;background:var(--accent-quiet);border:1px solid var(--accent-ring)"></div><span class="n">4</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-3);height:44px;border-radius:2px;background:var(--accent-quiet);border:1px solid var(--accent-ring)"></div><span class="n">6</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-4);height:44px;border-radius:2px;background:var(--accent-quiet);border:1px solid var(--accent-ring)"></div><span class="n">8</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-5);height:44px;border-radius:2px;background:var(--accent-quiet);border:1px solid var(--accent-ring)"></div><span class="n">12</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-6);height:44px;border-radius:2px;background:var(--accent-quiet);border:1px solid var(--accent-ring)"></div><span class="n">16</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-7);height:44px;border-radius:2px;background:var(--accent-quiet);border:1px solid var(--accent-ring)"></div><span class="n">20</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-8);height:44px;border-radius:2px;background:var(--accent-quiet);border:1px solid var(--accent-ring)"></div><span class="n">24</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-9);height:44px;border-radius:2px;background:var(--accent-quiet);border:1px solid var(--accent-ring)"></div><span class="n">32</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-10);height:44px;border-radius:2px;background:var(--accent-quiet);border:1px solid var(--accent-ring)"></div><span class="n">40</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-11);height:44px;border-radius:2px;background:var(--accent-quiet);border:1px solid var(--accent-ring)"></div><span class="n">56</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-12);height:44px;border-radius:2px;background:var(--accent-quiet);border:1px solid var(--accent-ring)"></div><span class="n">72</span></div></div></div></body></html>
