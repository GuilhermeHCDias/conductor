<!DOCTYPE html><html data-theme="aurora"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 18px;min-height:100vh;display:flex;align-items:center;background:var(--bg-wash),var(--bg-window)}.w{width:100%;display:grid;gap:10px}.n{font:var(--type-mono-label);color:var(--text-tertiary)}.cap{font:var(--type-label);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="w"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"><div style="display:grid;gap:5px"><div style="height:54px;border-radius:var(--radius-sm);background:var(--blue-200);border:1px solid var(--edge-1)"></div><div class="n">200</div></div><div style="display:grid;gap:5px"><div style="height:54px;border-radius:var(--radius-sm);background:var(--blue-300);border:1px solid var(--edge-1)"></div><div class="n">300</div></div><div style="display:grid;gap:5px"><div style="height:54px;border-radius:var(--radius-sm);background:var(--blue-400);border:1px solid var(--edge-1)"></div><div class="n">400</div></div><div style="display:grid;gap:5px"><div style="height:54px;border-radius:var(--radius-sm);background:var(--blue-500);border:1px solid var(--edge-1)"></div><div class="n">500</div></div></div><div style="display:flex;gap:10px;align-items:center"><span style="padding:6px 12px;border-radius:var(--radius-pill);background:var(--ai-quiet);border:1px solid var(--ai-edge);color:var(--text-ai);font:var(--type-caption)">AI-authored</span><span class="n">--ai · --ai-quiet · --ai-edge · --text-ai</span></div></div></body></html>
