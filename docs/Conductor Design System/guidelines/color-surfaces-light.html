<!DOCTYPE html><html data-theme="aurora"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 18px;min-height:100vh;display:flex;align-items:center;background:var(--bg-wash),var(--bg-window)}.w{width:100%;display:grid;gap:10px}.n{font:var(--type-mono-label);color:var(--text-tertiary)}.cap{font:var(--type-label);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="w"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="display:grid;gap:6px"><div style="height:58px;border-radius:var(--a-radius-region);background:var(--a-chrome);border:1px solid var(--a-hair);box-shadow:var(--shadow-inset-top),var(--shadow-2);backdrop-filter:blur(22px) saturate(180%)"></div><div class="n">chrome · 34%</div></div><div style="display:grid;gap:6px"><div style="height:58px;border-radius:var(--a-radius-region);background:var(--a-well);border:1px solid var(--a-hair);box-shadow:var(--shadow-inset-top),var(--shadow-2);backdrop-filter:blur(22px) saturate(180%)"></div><div class="n">well · 46%</div></div><div style="display:grid;gap:6px"><div style="height:58px;border-radius:var(--a-radius-region);background:var(--a-panel);border:1px solid var(--a-hair);box-shadow:var(--shadow-inset-top),var(--shadow-2);backdrop-filter:blur(22px) saturate(180%)"></div><div class="n">panel · 62%</div></div><div style="display:grid;gap:6px"><div style="height:58px;border-radius:var(--a-radius-region);background:var(--a-content);border:1px solid var(--a-hair);box-shadow:var(--shadow-inset-top),var(--shadow-2);backdrop-filter:blur(22px) saturate(180%)"></div><div class="n">content · 80%</div></div></div><div class="n">Frost is never nested inside frost. A panel edge reads from the fill difference and the shadow, not from a border — hairlines are 7% ink.</div></div></body></html>
