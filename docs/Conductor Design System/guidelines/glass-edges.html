<!DOCTYPE html><html data-theme="aurora-dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 18px;min-height:100vh;display:flex;align-items:center}.w{width:100%}.n{font:var(--type-mono-label);color:var(--text-tertiary);letter-spacing:0}.cap{font:var(--type-label);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-disabled)}</style></head><body class="cd-wash"><div class="w"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="display:grid;gap:6px"><div style="height:44px;border-radius:var(--radius-md);background:var(--glass-1);border:1px solid var(--edge-1)"></div><div class="n">--edge-1</div><div class="n" style="color:var(--text-disabled)">9% white</div></div><div style="display:grid;gap:6px"><div style="height:44px;border-radius:var(--radius-md);background:var(--glass-1);border:1px solid var(--edge-2)"></div><div class="n">--edge-2</div><div class="n" style="color:var(--text-disabled)">14% white</div></div><div style="display:grid;gap:6px"><div style="height:44px;border-radius:var(--radius-md);background:var(--glass-1);border:1px solid var(--edge-strong)"></div><div class="n">--edge-strong</div><div class="n" style="color:var(--text-disabled)">22% white</div></div><div style="display:grid;gap:6px"><div style="height:44px;border-radius:var(--radius-md);background:var(--glass-1);border:1px solid var(--edge-sunken)"></div><div class="n">--edge-sunken</div><div class="n" style="color:var(--text-disabled)">34% black</div></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
<div style="height:40px;border-radius:var(--radius-md);background:var(--glass-2);border:1px solid var(--edge-2);box-shadow:var(--shadow-inset-top);display:grid;place-items:center;font:var(--type-caption)">with --shadow-inset-top</div>
<div style="height:40px;border-radius:var(--radius-md);background:var(--glass-2);border:1px solid var(--edge-2);display:grid;place-items:center;font:var(--type-caption);color:var(--text-tertiary)">without — reads flat</div></div></div></body></html>
