<!-- @dsCard group="Glass" viewport="700x170" name="Raised vs sunken" subtitle="Glass rises to act; wells recede to be read or typed into" -->
<!DOCTYPE html><html data-theme="aurora-dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 18px;min-height:100vh;display:flex;align-items:center}.w{width:100%}.n{font:var(--type-mono-label);color:var(--text-tertiary);letter-spacing:0}.cap{font:var(--type-label);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-disabled)}</style></head><body class="cd-wash"><div class="w"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="cd-glass-2" style="border-radius:var(--radius-lg);padding:14px;display:grid;gap:8px"><span style="font:var(--type-body-strong)">Raised — controls</span><span class="n">--glass-2 + --shadow-inset-top + --shadow-1</span><div style="display:flex;gap:8px"><span style="display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-on);font:var(--type-caption)">Run Test</span><span style="display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:var(--radius-sm);background:var(--glass-2);border:1px solid var(--edge-2);font:var(--type-caption)">Cloud</span></div></div>
<div class="cd-sunken" style="border-radius:var(--radius-lg);padding:14px;display:grid;gap:8px"><span style="font:var(--type-body-strong)">Sunken — content</span><span class="n">--glass-sunken + --shadow-inset-sunken</span><div style="height:30px;border-radius:var(--radius-sm);background:var(--glass-sunken);border:1px solid var(--edge-sunken);display:flex;align-items:center;padding:0 10px;font:var(--type-code-sm);color:var(--text-tertiary)">editor · logs · inputs</div></div></div></div></body></html>
