<!-- @dsCard group="Colors" viewport="700x170" name="Aurora dark — surfaces" subtitle="Frost turns WHITE at low alpha, never black: a dark panel over a dark wash reads as a hole." -->
<!DOCTYPE html><html data-theme="aurora-dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 18px;min-height:100vh;display:flex;align-items:center;background:var(--bg-wash),var(--bg-window)}.w{width:100%;display:grid;gap:10px}.n{font:var(--type-mono-label);color:var(--text-tertiary)}.cap{font:var(--type-label);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="w"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="display:grid;gap:6px"><div style="height:58px;border-radius:var(--a-radius-region);background:var(--a-chrome);border:1px solid var(--a-hair);box-shadow:var(--shadow-inset-top),var(--shadow-2);backdrop-filter:blur(22px) saturate(180%)"></div><div class="n">chrome · 5.5%</div></div><div style="display:grid;gap:6px"><div style="height:58px;border-radius:var(--a-radius-region);background:var(--a-well);border:1px solid var(--a-hair);box-shadow:var(--shadow-inset-top),var(--shadow-2);backdrop-filter:blur(22px) saturate(180%)"></div><div class="n">well · 6%</div></div><div style="display:grid;gap:6px"><div style="height:58px;border-radius:var(--a-radius-region);background:var(--a-panel);border:1px solid var(--a-hair);box-shadow:var(--shadow-inset-top),var(--shadow-2);backdrop-filter:blur(22px) saturate(180%)"></div><div class="n">panel · 8.5%</div></div><div style="display:grid;gap:6px"><div style="height:58px;border-radius:var(--a-radius-region);background:var(--a-content);border:1px solid var(--a-hair);box-shadow:var(--shadow-inset-top),var(--shadow-2);backdrop-filter:blur(22px) saturate(180%)"></div><div class="n">content · 13%</div></div></div><div class="n">On dark the specular top edge does the separating — shadows barely read, so every panel carries --shadow-inset-top.</div></div></body></html>
