<!-- @dsCard group="Glass" viewport="700x160" name="Shadows & glows" subtitle="Soft, wide, low opacity. Focus glows replace focus rings." -->
<!DOCTYPE html><html data-theme="aurora-dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 18px;min-height:100vh;display:flex;align-items:center}.w{width:100%}.n{font:var(--type-mono-label);color:var(--text-tertiary);letter-spacing:0}.cap{font:var(--type-label);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-disabled)}</style></head><body class="cd-wash"><div class="w"><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:center">
<div style="display:grid;gap:6px"><div style="height:46px;border-radius:var(--radius-md);background:var(--glass-2);border:1px solid var(--edge-2);box-shadow:var(--shadow-1)"></div><div class="n">shadow-1</div></div><div style="display:grid;gap:6px"><div style="height:46px;border-radius:var(--radius-md);background:var(--glass-2);border:1px solid var(--edge-2);box-shadow:var(--shadow-2)"></div><div class="n">shadow-2</div></div><div style="display:grid;gap:6px"><div style="height:46px;border-radius:var(--radius-md);background:var(--glass-2);border:1px solid var(--edge-2);box-shadow:var(--shadow-3)"></div><div class="n">shadow-3</div></div>
<div style="display:grid;gap:6px"><div style="height:46px;border-radius:var(--radius-md);background:var(--accent-quiet);border:1px solid transparent;box-shadow:var(--glow-accent)"></div><div class="n">--glow-accent</div></div>
<div style="display:grid;gap:6px"><div style="height:46px;border-radius:var(--radius-md);background:var(--ai-quiet);border:1px solid transparent;box-shadow:var(--glow-ai)"></div><div class="n">--glow-ai</div></div></div></div></body></html>
