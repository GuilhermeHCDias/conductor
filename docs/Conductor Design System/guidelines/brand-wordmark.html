<!DOCTYPE html><html data-theme="aurora"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:16px 18px;min-height:100vh;display:flex;align-items:center;background:var(--bg-wash),var(--bg-window)}.w{width:100%;display:grid;gap:14px}.n{font:var(--type-mono-label);color:var(--text-tertiary)}.cap{font:var(--type-label);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="w" style="grid-template-columns:auto 1fr;align-items:center;column-gap:20px"><img src="../assets/logo.png" alt="Conductor" width="104" height="104" style="border-radius:22px;grid-row:span 3"><span style="font-family:var(--font-display);font-weight:800;font-size:44px;letter-spacing:-0.05em;background:var(--grad-aurora);-webkit-background-clip:text;background-clip:text;color:transparent">Conductor</span><span style="font-family:var(--font-display);font-weight:800;font-size:28px;letter-spacing:-0.045em;color:var(--text-emphasis)">Conductor</span><div class="n">The mark and the gradient are brand-surface only — app icon, splash, wordmark. In the product the name is flat --text-emphasis.</div></div></body></html>
